
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static',
filename='css/styles.css') }}">

    <title>Plataforma de Streaming</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/Favicon.jpg') }}">
</head>

<body>

    <h1>Registro de películas</h1>
    <img src="{{ url_for('static', filename='img/logo.jpg') }}"
width="200">

    <form action="/agregar" method="POST">

        <!--
        action="/agregar" indica la ruta del servidor donde se enviarán los datos.

        method="POST" envía los datos al servidor sin mostrarlos en la URL.
        -->

        <input type="text" name="titulo" placeholder="Título" required>

        <!-- Campo para capturar el título de la película -->

        <input type="text" name="genero" placeholder="Género" required>

        <!-- Campo para capturar el género -->

        <input type="number" name="anio" placeholder="Año" required>

        <!-- Campo numérico para capturar el año -->

        <div style="width: 100%; display: flex; justify-content: center;">
            <button type="submit" 
                    title="Guardar"
                    style="display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; width: auto; padding: 12px;">
                <img src="{{ url_for('static', filename='img/save.svg') }}" 
                    alt="Guardar" 
                    style="width: 22px; height: 22px; border-radius: 0; border: none; box-shadow: none; margin: 0;">
            </button>
        </div>

        <!-- Botón que envía el formulario -->

    </form>


    <h2>Lista de películas</h2>

    <table border="1">

        <!-- Tabla para mostrar los datos -->

        <tr>
            <th>Título</th>
            <th>Género</th>
            <th>Año</th>
            <th style="text-align: center;">
                Eliminar
            </th> <!-- campo para mostrar acciones -->
            <th style="text-align: center;">
                Actualizar
            </th>
        </tr>

        <!-- Encabezados de la tabla -->

        {% for pelicula in peliculas %}

        <!--
        Bucle de Jinja2 (Flask).
        Recorre la lista de películas enviada desde Python.
        -->

        <tr>

            <td>{{ pelicula.titulo }}</td>

            <!-- Muestra el título de la película -->

            <td>{{ pelicula.genero }}</td>

            <!-- Muestra el género -->

            <td>{{ pelicula.anio }}</td>

            <!-- Muestra el año -->

            <td style="text-align: center;">
                <a href="/eliminar/{{ pelicula._id }}"
                title="Eliminar"
                onclick="return confirm('¿Estás seguro de eliminar esta película?')">
                    <img src="{{ url_for('static', filename='img/basura.svg') }}" 
                    alt="Eliminar"
                    style="width: 18px; height: 18px; border-radius: 0; border: none; box-shadow: none; margin: 0; vertical-align: middle;">
                </a>
            </td><!-- Enlace para eliminar la película con confirmación JavaScript -->

            <td style="text-align: center;">   
                <a href="/editar/{{ pelicula._id }}" title="Editar">
                    <img src="{{ url_for('static', filename='img/Lapiz.svg') }}" 
                    alt="Editar"
                    style="width: 18px; height: 18px; border-radius: 0; border: none; box-shadow: none; margin: 0; vertical-align: middle;">
                </a>
            </td>

        </tr>

        {% endfor %}

        <!-- Fin del ciclo -->

    </table>

</body>

</html>
